<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 925" width="1300" height="925" role="img" aria-labelledby="title description">
	<title id="title">Consumer batch flow</title>
	<desc id="description">How a Kafka batch moves through kafka.ts, transactionBatchHandler and transaction-ingester: valid messages are inserted in one transaction, poison messages are dead-lettered, tombstones are skipped, a retryable failure exits without committing so the batch replays, and offsets are committed only after the handler returns.</desc>
	<defs>
		<style>
			.lane-title { font: 700 17px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #f2f2f2; }
			.lane-subtitle { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #9a9ca3; }
			.box-title { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f2f2f2; }
			.box-detail { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #a9abb3; }
			.edge-label { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #a9abb3; paint-order: stroke; stroke: #1d1e22; stroke-width: 5px; stroke-linejoin: round; }
			.box { fill: #1d1e22; stroke: #e4e4e7; stroke-width: 1.6; }
			.edge { fill: none; stroke: #d4d4d8; stroke-width: 1.6; }

			.teal-box { fill: #203432; stroke: #4fb3a9; stroke-width: 2; }
			.teal-edge { fill: none; stroke: #4fb3a9; stroke-width: 2; }
			.teal-text { fill: #5cc6bb; }

			.red-box { fill: #3a2624; stroke: #d9694f; stroke-width: 1.6; }
			.red-edge { fill: none; stroke: #d9694f; stroke-width: 1.6; stroke-dasharray: 7 5; }
			.red-text { fill: #e07a5f; }

			.amber-box { fill: #3a3122; stroke: #d9a43f; stroke-width: 1.6; }
			.amber-edge { fill: none; stroke: #d9a43f; stroke-width: 1.6; }
			.amber-text { fill: #e8b04b; }

			.green-box { fill: #22342a; stroke: #6dbb73; stroke-width: 1.6; }
			.green-edge { fill: none; stroke: #6dbb73; stroke-width: 2; }
			.green-text { fill: #7cc982; }

			.skip-edge { fill: none; stroke: #8b8d94; stroke-width: 1.4; stroke-dasharray: 3 4; }
			.lane-divider { stroke: #34353b; stroke-width: 1; stroke-dasharray: 4 6; }
			.boundary { stroke: #4fb3a9; stroke-width: 2; stroke-dasharray: 8 6; }
		</style>
		<marker id="arrow-neutral" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d4d4d8"/></marker>
		<marker id="arrow-teal" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4fb3a9"/></marker>
		<marker id="arrow-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9694f"/></marker>
		<marker id="arrow-amber" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9a43f"/></marker>
		<marker id="arrow-green" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6dbb73"/></marker>
		<marker id="arrow-skip" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b8d94"/></marker>
	</defs>

	<rect x="1" y="1" width="1298" height="923" rx="14" fill="#1d1e22" stroke="#34353b"/>

	<!-- Lanes -->
	<text class="lane-title" x="140" y="48" text-anchor="middle">KAFKA</text>
	<text class="lane-subtitle" x="140" y="70" text-anchor="middle">broker</text>
	<text class="lane-title" x="440" y="48" text-anchor="middle">kafka.ts</text>
	<text class="lane-subtitle" x="440" y="70" text-anchor="middle">library adapter</text>
	<text class="lane-title" x="800" y="48" text-anchor="middle">transactionBatchHandler</text>
	<text class="lane-subtitle" x="800" y="70" text-anchor="middle">policy</text>
	<text class="lane-title" x="1135" y="48" text-anchor="middle">transaction-ingester</text>
	<text class="lane-subtitle" x="1135" y="70" text-anchor="middle">domain + postgres</text>

	<line class="lane-divider" x1="265" y1="88" x2="265" y2="870"/>
	<line class="lane-divider" x1="975" y1="88" x2="975" y2="870"/>
	<line class="boundary" x1="620" y1="88" x2="620" y2="870"/>
	<text class="edge-label teal-text" x="630" y="104">ClassifiedMessage[] crosses here</text>

	<!-- Boxes: KAFKA -->
	<rect class="box" x="40" y="120" width="200" height="70" rx="8"/>
	<text class="box-title" x="140" y="148" text-anchor="middle">source topic</text>
	<text class="box-detail" x="140" y="172" text-anchor="middle">transactions.&lt;type&gt;</text>

	<rect class="amber-box" x="40" y="687" width="200" height="70" rx="8"/>
	<text class="box-title amber-text" x="140" y="715" text-anchor="middle">DLQ topic</text>
	<text class="box-detail amber-text" x="140" y="738" text-anchor="middle">&lt;topic&gt;.dlq · acks=all</text>

	<rect class="green-box" x="40" y="791" width="200" height="70" rx="8"/>
	<text class="box-title green-text" x="140" y="818" text-anchor="middle">offsets advance</text>
	<text class="box-detail green-text" x="140" y="841" text-anchor="middle">highest per partition</text>

	<!-- Boxes: kafka.ts -->
	<rect class="box" x="290" y="120" width="300" height="70" rx="8"/>
	<text class="box-title" x="440" y="148" text-anchor="middle">consume · deserialise</text>
	<text class="box-detail" x="440" y="172" text-anchor="middle">Avro · registry · autocommit off</text>

	<rect class="box" x="345" y="220" width="245" height="76" rx="8"/>
	<text class="box-title" x="467.5" y="245" text-anchor="middle">buffer → flush</text>
	<text class="box-detail" x="467.5" y="267" text-anchor="middle">at 100 msgs or 2 s linger</text>
	<text class="box-detail" x="467.5" y="285" text-anchor="middle">one flush at a time</text>

	<rect class="teal-box" x="345" y="326" width="245" height="62" rx="8"/>
	<text class="box-title teal-text" x="467.5" y="352" text-anchor="middle">classifyMessages</text>
	<text class="box-detail teal-text" x="467.5" y="374" text-anchor="middle">→ ClassifiedMessage[]</text>

	<rect class="red-box" x="290" y="437" width="300" height="66" rx="8"/>
	<text class="box-title red-text" x="440" y="463" text-anchor="middle">propagate · no commit</text>
	<text class="box-detail red-text" x="440" y="486" text-anchor="middle">stream destroyed · exit 1</text>

	<rect class="green-box" x="290" y="791" width="300" height="70" rx="8"/>
	<text class="box-title green-text" x="440" y="818" text-anchor="middle">commitBatch</text>
	<text class="box-detail green-text" x="440" y="841" text-anchor="middle">only after a normal return</text>

	<!-- Boxes: transactionBatchHandler -->
	<rect class="box" x="650" y="326" width="300" height="62" rx="8"/>
	<text class="box-title" x="800" y="352" text-anchor="middle">triage by kind</text>
	<text class="box-detail" x="800" y="374" text-anchor="middle">valid | tombstone | poison</text>

	<polygon points="700,470 805,426 910,470 805,514" fill="#1d1e22" stroke="#d9694f" stroke-width="1.6"/>
	<text class="box-detail red-text" x="805" y="466" text-anchor="middle" style="font-size: 14px">RetryableError</text>
	<text class="box-detail red-text" x="805" y="484" text-anchor="middle" style="font-size: 14px">?</text>

	<rect class="box" x="690" y="562" width="230" height="62" rx="8"/>
	<text class="box-title" x="805" y="588" text-anchor="middle">fallback · one-by-one</text>
	<text class="box-detail" x="805" y="610" text-anchor="middle">each: insert, or DLQ it</text>

	<rect class="amber-box" x="690" y="672" width="230" height="70" rx="8"/>
	<text class="box-title amber-text" x="805" y="698" text-anchor="middle">sendToDeadLetterQueue</text>
	<text class="box-detail amber-text" x="805" y="721" text-anchor="middle">original bytes + headers</text>

	<rect class="box" x="650" y="795" width="300" height="62" rx="8" style="stroke-width: 2.2"/>
	<text class="box-title" x="800" y="821" text-anchor="middle">return</text>
	<text class="box-detail" x="800" y="843" text-anchor="middle">every message resolved</text>

	<!-- Boxes: transaction-ingester -->
	<rect class="box" x="1000" y="318" width="270" height="78" rx="8"/>
	<text class="box-title" x="1135" y="343" text-anchor="middle">normalise · categorise</text>
	<text class="box-detail" x="1135" y="365" text-anchor="middle">rules compiled at boot</text>
	<text class="box-detail" x="1135" y="383" text-anchor="middle">bad mapping → NonRetryable</text>

	<rect class="box" x="1000" y="430" width="270" height="80" rx="8"/>
	<text class="box-title" x="1135" y="455" text-anchor="middle">runInTransaction · insert</text>
	<text class="box-detail" x="1135" y="477" text-anchor="middle">UNNEST · ON CONFLICT DO NOTHING</text>
	<text class="box-detail" x="1135" y="495" text-anchor="middle">classifyPostgresError on throw</text>

	<path d="M1040,572 L1040,632 A95,14 0 0 0 1230,632 L1230,572" fill="#1d1e22" stroke="#e4e4e7" stroke-width="1.6"/>
	<ellipse cx="1135" cy="572" rx="95" ry="14" fill="#1d1e22" stroke="#e4e4e7" stroke-width="1.6"/>
	<text class="box-detail" x="1135" y="612" text-anchor="middle" style="font-size: 14px; fill: #f2f2f2">txn_agg.transactions</text>

	<!-- Normal path -->
	<line class="edge" x1="240" y1="155" x2="290" y2="155" marker-end="url(#arrow-neutral)"/>
	<text class="edge-label" x="265" y="146" text-anchor="middle">fetch</text>
	<line class="edge" x1="467.5" y1="190" x2="467.5" y2="220" marker-end="url(#arrow-neutral)"/>
	<line class="edge" x1="467.5" y1="296" x2="467.5" y2="326" marker-end="url(#arrow-neutral)"/>
	<line class="teal-edge" x1="590" y1="357" x2="650" y2="357" marker-end="url(#arrow-teal)"/>
	<text class="edge-label teal-text" x="620" y="347" text-anchor="middle">onBatch</text>
	<line class="teal-edge" x1="950" y1="357" x2="1000" y2="357" marker-end="url(#arrow-teal)"/>
	<text class="edge-label teal-text" x="975" y="347" text-anchor="middle">valid</text>
	<line class="edge" x1="1135" y1="396" x2="1135" y2="430" marker-end="url(#arrow-neutral)"/>
	<line class="edge" x1="1135" y1="510" x2="1135" y2="558" marker-end="url(#arrow-neutral)"/>
	<line class="edge" x1="805" y1="514" x2="805" y2="562" marker-end="url(#arrow-neutral)"/>
	<text class="edge-label" x="815" y="542">no — data error</text>
	<line class="edge" x1="805" y1="742" x2="805" y2="795" marker-end="url(#arrow-neutral)"/>

	<!-- Tombstones: counted, nothing else -->
	<line class="skip-edge" x1="935" y1="388" x2="935" y2="795" marker-end="url(#arrow-skip)"/>
	<text class="edge-label" x="943" y="600" text-anchor="middle" transform="rotate(90 943 600)">tombstone · count · skip</text>

	<!-- Crash path: nothing commits, the restart replays -->
	<path class="red-edge" d="M1000,385 H985 V470 H910" marker-end="url(#arrow-red)"/>
	<line class="red-edge" x1="1000" y1="470" x2="985" y2="470"/>
	<text class="edge-label red-text" x="955" y="461" text-anchor="middle">throw</text>
	<line class="red-edge" x1="700" y1="470" x2="590" y2="470" marker-end="url(#arrow-red)"/>
	<text class="edge-label red-text" x="648" y="461" text-anchor="middle">yes · rethrow</text>
	<path class="red-edge" d="M690,593 H440 V503" marker-end="url(#arrow-red)"/>
	<text class="edge-label red-text" x="530" y="611" text-anchor="middle">retryable mid-loop</text>
	<line class="red-edge" x1="315" y1="190" x2="315" y2="437" marker-end="url(#arrow-red)"/>
	<text class="edge-label red-text" x="324" y="313" text-anchor="middle" transform="rotate(90 324 313)">unknown schema id → FAIL</text>
	<path class="red-edge" d="M290,470 H70 V190" marker-end="url(#arrow-red)"/>
	<text class="edge-label red-text" x="82" y="300">exit 1 · restart</text>
	<text class="edge-label red-text" x="82" y="318">replays from the</text>
	<text class="edge-label red-text" x="82" y="336">last commit</text>

	<!-- Dead-letter path -->
	<path class="amber-edge" d="M668,388 V688 H690" marker-end="url(#arrow-amber)"/>
	<text class="edge-label amber-text" x="676" y="412">poison</text>
	<line class="amber-edge" x1="805" y1="624" x2="805" y2="672" marker-end="url(#arrow-amber)"/>
	<text class="edge-label amber-text" x="815" y="652">still failing</text>
	<line class="amber-edge" x1="690" y1="722" x2="240" y2="722" marker-end="url(#arrow-amber)"/>
	<text class="edge-label amber-text" x="455" y="712" text-anchor="middle">x-dlq-reason · x-dlq-error · x-source-*</text>

	<!-- Commit path -->
	<path class="green-edge" d="M1015,510 V826 H950" marker-end="url(#arrow-green)"/>
	<text class="edge-label green-text" x="1027" y="700">BatchOutcome</text>
	<line class="green-edge" x1="650" y1="826" x2="590" y2="826" marker-end="url(#arrow-green)"/>
	<line class="green-edge" x1="290" y1="826" x2="240" y2="826" marker-end="url(#arrow-green)"/>

	<!-- Legend -->
	<g transform="translate(40 898)">
		<line class="teal-edge" x1="0" y1="-4" x2="26" y2="-4"/>
		<text class="edge-label" x="34" y="0">crosses the adapter boundary</text>
		<line class="red-edge" x1="270" y1="-4" x2="296" y2="-4"/>
		<text class="edge-label" x="304" y="0">no commit · exit · replay</text>
		<line class="amber-edge" x1="510" y1="-4" x2="536" y2="-4"/>
		<text class="edge-label" x="544" y="0">dead-lettered</text>
		<line class="green-edge" x1="670" y1="-4" x2="696" y2="-4"/>
		<text class="edge-label" x="704" y="0">committed</text>
		<line class="skip-edge" x1="800" y1="-4" x2="826" y2="-4"/>
		<text class="edge-label" x="834" y="0">skipped</text>
	</g>
</svg>

      # Logging configuration
      LOG_LEVEL: info
      LOG_FORMAT: json
      LOG_PRETTY: false
      # Postgres configuration
      DATABASE_HOST: localhost
      DATABASE_NAME: txn_agg
      DATABASE_PORT: 5432
      DATABASE_USER: 'kafka_consumer'
      DATABASE_POOL_MIN: 2
      DATABASE_POOL_MAX: 10
      DATABASE_IDLE_TIMEOUT: 30000
      DATABASE_CONNECTION_TIMEOUT: 5000
      # Schema Registry configuration
      SCHEMA_REGISTRY_URL: 'http://localhost:8081'
      # KAFKA configuration
      KAFKA_BROKERS: 'localhost:9092'
      KAFKA_USERNAME: consumer
      KAFKA_SASL_MECHANISM: SCRAM-SHA-512
      # Kafka group membership — library defaults (60s session) stall restarts
      KAFKA_SESSION_TIMEOUT_MS: 15000
      KAFKA_HEARTBEAT_INTERVAL_MS: 5000
      KAFKA_REBALANCE_TIMEOUT_MS: 30000
      KAFKA_REQUEST_TIMEOUT_MS: 40000
      # Fetch and batching
      KAFKA_MAX_WAIT_TIME_MS: 1000
      KAFKA_BATCH_SIZE: 100
      KAFKA_BATCH_LINGER_MS: 2000
      KAFKA_READ_MODE: earliest
      # Retry policy for infrastructure failures
      KAFKA_MAX_RETRIES: 5
      KAFKA_RETRY_BASE_DELAY_MS: 500
      # Secrets 
      DATABASE_PASSWORD_SECRET_NAME: 'consumer_database_password'
      KAFKA_PASSWORD_SECRET_NAME: 'consumer_kafka_password'
      WRITER_DSN: postgres://worker_role:worker@postgres:5432/postgres
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_SAMPLER: always_on
    networks: [txn-network]

  # api:
  #   build: { context: ./apps/api }
  #   container_name: api
  #   depends_on:
  #     migrate: { condition: service_completed_successfully }
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     READER_DSN: postgres://api_role:api@postgres:5432/postgres
  #     JWT_SECRET: dev-secret-change-me
  #     KAFKA_BROKERS: kafka1:9094 # admin stats (lag, DLQ depth)
  #     KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  #     KAFKA_SASL_USERNAME: app-worker
  #     KAFKA_SASL_PASSWORD: app-worker-secret
  #     OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  #     OTEL_TRACES_SAMPLER: always_on
  #   networks: [txn-network]

  # ─────────────────────── Optional: cache profile ───────────────────────
  redis:
    profiles: ["cache"]
    image: redis:7.4-alpine
    container_name: redis
    networks: [txn-network]

  # ──────────────────────── Optional: obs profile ────────────────────────
  otel-collector:
    profiles: ["obs"]
    image: otel/opentelemetry-collector-contrib:0.116.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infrastructure/obs/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [txn-network]

  tempo:
    profiles: ["obs"]
    image: grafana/tempo:2.6.1
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infrastructure/obs/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [txn-network]

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    volumes:
      - ./infrastructure/obs/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    networks: [txn-network]

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - ./infrastructure/obs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/obs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [txn-network]

  # ──────────────────────── Optional: ui profile ─────────────────────────
  # Tiny LDAP directory backing kafbat-ui logins. kafbat has no static
  # multi-user store (auth.type supports only DISABLED/LOGIN_FORM/LDAP/OAUTH2,
  # and LOGIN_FORM is single-user), so multiple UI users require LDAP or OAuth.
  # Users/groups seeded from infrastructure/ldap/users.ldif:
  #   admin/admin   (group: admins  → full UI access)
  #   viewer/viewer (group: viewers → read-only UI access)
  ldap:
    profiles: ["ui"]
    image: osixia/openldap:1.5.0
    container_name: ldap
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: Transaction Aggregator
      LDAP_DOMAIN: txn.local
      LDAP_ADMIN_PASSWORD: admin-ldap
    volumes:
      - ./infrastructure/ldap/users.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/users.ldif:ro
    healthcheck:
      test: ldapsearch -x -H ldap://localhost -D cn=admin,dc=txn,dc=local -w admin-ldap -b dc=txn,dc=local -s base > /dev/null
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [txn-network]

  kafbat-ui:
    profiles: ["ui"]
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafbat-ui
    ports:
      - "8080:8080"
    environment:
      # 1. Kafka clusters for the UI to connect to (PLAINTEXT internal listener)
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

      # 2. Authentication against the ldap sidecar.
      #    OAUTH2_LDAP_ACTIVEDIRECTORY must be explicitly "false": kafbat's LDAP
      #    authenticator bean is @ConditionalOnProperty(havingValue = "false")
      #    with no matchIfMissing — omit it and the UI crashes on startup with
      #    "An LdapAuthenticator must be supplied".
      AUTH_TYPE: LDAP
      OAUTH2_LDAP_ACTIVEDIRECTORY: "false"
      SPRING_LDAP_URLS: ldap://ldap:389
      SPRING_LDAP_BASE: uid={0},ou=people,dc=txn,dc=local
      SPRING_LDAP_ADMIN_USER: cn=admin,dc=txn,dc=local
      SPRING_LDAP_ADMIN_PASSWORD: admin-ldap
      SPRING_LDAP_USER_FILTER_SEARCH_BASE: ou=people,dc=txn,dc=local
      SPRING_LDAP_USER_FILTER_SEARCH_FILTER: "(&(uid={0})(objectClass=inetOrgPerson))"
      SPRING_LDAP_GROUP_FILTER_SEARCH_BASE: ou=groups,dc=txn,dc=local

      # 3. RBAC: LDAP group → UI permissions, defined in infrastructure/kafbat/rbac.yml
      #    (admins = full access incl. topic create; viewers = read-only)
      SPRING_CONFIG_ADDITIONAL_LOCATION: /etc/kafkaui/rbac.yml

      # 4. Session lifetime: Spring WebFlux defaults to a 30-minute idle timeout,
      #    which forces constant re-logins. 12h ≈ one working day. Cookie max-age
      #    matches so the login also survives a browser restart. Sessions are
      #    in-memory — recreating the container still logs everyone out.
      SERVER_REACTIVE_SESSION_TIMEOUT: 12h
      SERVER_REACTIVE_SESSION_COOKIE_MAX_AGE: 12h
    volumes:
      - ./infrastructure/kafbat/rbac.yml:/etc/kafkaui/rbac.yml:ro
    depends_on:
      kafka1: { condition: service_healthy }
      ldap: { condition: service_healthy }
    networks: [txn-network]

  # Schema sample preview: avro-datagen's Streamlit UI over /schemas — generate
  # example records to copy/paste while writing normalizers/tests. Kafka producer
  # section is NOT enabled (no --kafka flag, no broker access needed); the mount
  # is read-only, so contract changes still go through git review, never the UI.
  # Run alone with: docker compose up avro-datagen-ui  →  http://localhost:6500
  avro-datagen-ui:
    profiles: ["ui"]
    build: { context: ./infrastructure/avro-datagen-ui }
    pull_policy: build
    container_name: avro-datagen-ui
    environment:
      PORT: "6500" # compose owns the port; the image hardcodes nothing
    ports:
      - "6500:6500"
    volumes:
      - ./schemas/:/schemas:ro
    networks: [txn-network]

networks:
  txn-network:
    driver: bridge

volumes:
  kafka1-data:
  postgres-data:
  tempo-data:

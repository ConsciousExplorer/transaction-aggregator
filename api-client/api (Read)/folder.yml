info:
  name: api (Read)
  type: folder
  seq: 1

request:
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{idp}}/realms/txn-api/protocol/openid-connect/token"
    credentials:
      clientId: banking-service
      clientSecret: banking-service-secret
      placement: body
    tokenConfig:
      id: read-only
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true

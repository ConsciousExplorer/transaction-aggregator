info:
  name: List transactions
  type: http
  seq: 1

http:
  method: GET
  url: "{{api}}/api/v1/users/{{userId}}/transactions?fromDateTime=2025-10-21T00:00:00Z&toDateTime=2026-10-21T00:00:00Z&limit=10"
  params:
    - name: fromDateTime
      value: 2025-10-21T00:00:00Z
      type: query
    - name: toDateTime
      value: 2026-10-21T00:00:00Z
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data[0].transactionId
        method: jsonq
      variable:
        name: transactionId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.links.next
        method: jsonq
      variable:
        name: nextPage
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

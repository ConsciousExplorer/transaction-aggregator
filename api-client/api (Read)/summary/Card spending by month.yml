info:
  name: Card spending by month
  type: http
  seq: 7

http:
  method: GET
  url: "{{api}}/api/v1/users/{{userId}}/summary?fromDateTime=2025-10-21T00:00:00Z&toDateTime=2026-10-21T00:00:00Z&transactionType=card&creditDebitIndicator=debit&interval=month"
  params:
    - name: fromDateTime
      value: 2025-10-21T00:00:00Z
      type: query
    - name: toDateTime
      value: 2026-10-21T00:00:00Z
      type: query
    - name: transactionType
      value: card
      type: query
    - name: creditDebitIndicator
      value: debit
      type: query
    - name: interval
      value: month
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

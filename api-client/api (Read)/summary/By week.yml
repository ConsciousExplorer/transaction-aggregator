info:
  name: By week
  type: http
  seq: 3

http:
  method: GET
  url: "{{api}}/api/v1/users/{{userId}}/summary?fromDateTime=2026-07-01T00:00:00Z&toDateTime=2026-10-01T00:00:00Z&interval=week"
  params:
    - name: fromDateTime
      value: 2026-07-01T00:00:00Z
      type: query
    - name: toDateTime
      value: 2026-10-01T00:00:00Z
      type: query
    - name: interval
      value: week
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

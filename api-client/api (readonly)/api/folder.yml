info:
  name: api
  type: folder
  seq: 5

request:
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{idp}}/realms/txn-api/protocol/openid-connect/token"
    credentials:
      clientId: banking-portal
      clientSecret: banking-portal-secret
      placement: body
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true

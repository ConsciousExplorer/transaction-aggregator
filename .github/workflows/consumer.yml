# Audit, type-check, lint and test the consumer, only when something it depends
# on changed. See api.yml for why the changes job always runs.
name: consumer

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: consumer changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.app.outputs.app }}
      versioned: ${{ steps.versioned.outputs.versioned }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: app
        uses: dorny/paths-filter@v4.0.3
        with:
          base: ${{ github.ref_name }}
          filters: |
            app:
              - 'apps/consumer/**'
              - 'schemas/*.avsc'
              - 'database/migrations/**'
              - 'infrastructure/postgres/**'
              - 'secrets/**'
              - '.github/workflows/consumer.yml'
      - id: versioned
        uses: dorny/paths-filter@v4.0.3
        with:
          base: ${{ github.ref_name }}
          predicate-quantifier: every
          filters: |
            versioned:
              - 'apps/consumer/**'
              - '!apps/consumer/**/*.md'

  verify:
    name: consumer verify
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/consumer
    env:
      # test.env points DOCKER_HOST at a local Rancher socket; the variable set
      # here wins over --env-file
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: apps/consumer/package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: npm run lib:audit
      - name: Type-check
        run: npm run check
      - name: No circular imports
        run: npm run precheck
      - name: Lint and format
        run: npx @biomejs/biome ci .
      - name: Spelling
        run: npm run spell
      - name: Unit tests
        run: npm run test:unit
      # The generator writes unformatted code and the committed files are
      # Biome-formatted, so format before comparing
      - name: Generated schema types match schemas/
        run: |
          npm run schema:generate
          npx @biomejs/biome format --write src/schemas
          git diff --exit-code src/schemas
      - name: Integration tests
        run: npm run test:integration

  version:
    name: consumer version
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.versioned == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
      - name: Version is higher than the target branch's
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/check-version-bump.ts apps/consumer/package.json "$BASE_REF"

# Guards the API's HTTP contract. The committed openapi/openapi.json must be what
# the code generates, and a pull request into main must not break it for the
# clients that already use it.
name: api-contract

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: api-contract changes
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          base: ${{ github.ref_name }}
          filters: |
            contract:
              - 'apps/api/src/**'
              - 'apps/api/openapi/**'
              - 'apps/api/scripts/generate-openapi.ts'
              - 'apps/api/package.json'
              - 'apps/api/package-lock.json'
              - '.github/workflows/api-contract.yml'

  matches-code:
    name: api-contract matches code
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      # The generator builds the server from config defaults and sends no
      # request, so it needs no database, secrets or environment
      - name: Generate the contract
        run: npm run generate-contract
      - name: Committed contract matches the code
        run: git diff --exit-code openapi/

  no-breaking-changes:
    name: api-contract no breaking changes
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    env:
      OASDIFF_VERSION: 1.32.1
      OASDIFF_SHA256: 7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Read the target branch's contract
        id: base
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          if git show "$BASE_REF:apps/api/openapi/openapi.json" > "$RUNNER_TEMP/base-openapi.json" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$BASE_REF has no contract yet, so nothing can break"
          fi
      # The release binary, checked against a pinned hash, rather than the
      # oasdiff action, which builds a Docker image on every run
      - name: Install oasdiff
        if: steps.base.outputs.exists == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/${archive}"
          echo "${OASDIFF_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" oasdiff
      - name: No breaking changes against the target branch
        if: steps.base.outputs.exists == 'true'
        run: '"$RUNNER_TEMP/oasdiff" breaking "$RUNNER_TEMP/base-openapi.json" apps/api/openapi/openapi.json --fail-on ERR'

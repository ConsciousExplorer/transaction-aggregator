# Transaction Aggregation platform — docker compose
#
# Run it through the Makefile at the repo root (`make up`, `make generate`,
# `make down`, `make clean`); paths below are relative to this infrastructure/
# folder. Core services have NO profile: `make up` brings the whole system up.
#
# Optional profiles: ui (kafbat-ui, avro-datagen-ui — on by default in
# `make up`, `make up UI=` leaves them out), obs, cache. The Makefile passes
# them as --profile flags; compose does not read the repo-root .env from here.
#
# Broker topology:
# DEV: ONE combined KRaft node locally (RF 1).
# PROD: 3 KRaft nodes, RF 3, min.insync.replicas=2, SCRAM over TLS (MSK).
#
# Apps and ports. Host = published on localhost; "-" = in-network only.
# Third-party apps keep their vendor default container port.
#
#   Service           Profile  Host   Container  Notes
#   kafka1            core     9092   9092       EXTERNAL SASL listener (host tools)
#                                     29092      INTERNAL plaintext (SR, kafbat-ui, kafka-init)
#                                     9093       KRaft controller
#                                     9094       CLIENT SASL listener (producers, consumers)
#   schema-registry   core     8081   8081
#   postgres          core     5432   5432
#   keycloak          core     8086   8080       host 8080 belongs to kafbat-ui; health on 9000
#   api               core     8083   8083       REST API, /ready
#   consumer-* (x5)   core     -      8080       health + metrics; one image, one port, like
#                                                replicas on k8s/ECS. Prometheus scrapes in-network
#   kafbat-ui         ui       8080   8080
#   avro-datagen-ui   ui       8501   8501       Streamlit default
#   grafana           obs      3000   3000
#   prometheus        obs      9090   9090
#   tempo             obs      -      3200       HTTP query API (Grafana); OTLP gRPC in on 4317
#   otel-collector    obs      -      4317/4318  OTLP gRPC / HTTP (apps push traces here)
#   postgres-exporter obs      -      9187       Postgres statistics as metrics; Prometheus scrapes
#   redis             cache    -      6379
#
#   No ports (one-shots): kafka-init, schemas-register, migrate, producer-*

# The name the project had at the repo root: container, image, network and
# volume names stay transaction-aggregator-*, not infrastructure-*.
name: transaction-aggregator

services:
  # ──────────────────────────────── Kafka ────────────────────────────────
  kafka1:
    image: apache/kafka:4.0.0
    hostname: kafka1
    container_name: kafka-01
    ports:
      - "9092:9092" # EXTERNAL (host clients, SASL)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093
      # Listeners:
      #   INTERNAL  29092 — inter-broker, PLAINTEXT (private network)
      #   CONTROLLER 9093 — KRaft quorum
      #   CLIENT    9094 — SASL/SCRAM for services INSIDE the compose network
      #                    (the listener our apps actually use — mirrors MSK auth)
      #   EXTERNAL  9092 — SASL/SCRAM for host tools, advertised as localhost
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,CLIENT://0.0.0.0:9094,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,CLIENT://kafka1:9094,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,CLIENT:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_NAME_CLIENT_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_LISTENER_NAME_EXTERNAL_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/jaas/kafka_server_jaas.conf"

      # AuthZ: default-deny for SASL principals without ACLs (kafka-init grants them).
      # Super users: admin (SASL) + ANONYMOUS = the PLAINTEXT INTERNAL/CONTROLLER
      # listeners (inter-broker, healthcheck, schema-registry, kafbat-ui, kafka-init)
      # — those listeners never leave the private compose network. Prod (MSK) uses
      # SCRAM over TLS everywhere instead.
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:admin;User:ANONYMOUS

      # Single node → RF 1 for internal topics
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Governance: topics are created explicitly by kafka-init (12 partitions);
      # a typo'd topic name must FAIL, not materialize a default-partitioned orphan.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka1-data:/var/lib/kafka/data
      - ./kafka/kafka_server_jaas.conf:/etc/kafka/jaas/kafka_server_jaas.conf:ro
      # File input of the apache/kafka image: broker defaults + topic guardrails.
      # KAFKA_* env vars above override entries in this file.
      - ./kafka/server.properties:/mnt/shared/config/server.properties:ro
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 5
    networks: [txn-network]

  # One-shot: SCRAM credentials (app-worker, app-generator, host-admin) + the five
  # application topics (txn.{card,loan,transfer,airtime}.v1, txn.dlq.v1 — 12 partitions).
  kafka-init:
    image: apache/kafka:4.0.0
    container_name: kafka-init
    depends_on:
      kafka1: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/infrastructure/kafka/init-kafka.sh"]
    restart: "no"
    volumes:
      - ./kafka/:/infrastructure/kafka:ro
    networks: [txn-network]

  # ─────────────────────────── Schema Registry ───────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:8.0.0
    container_name: schema-registry
    depends_on:
      kafka1: { condition: service_healthy }
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka1:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: curl -fs http://localhost:8081/subjects > /dev/null
      # SR is a JVM booting alongside Kafka's JVM; cold starts can exceed a
      # tight window, and an "unhealthy" verdict aborts every dependent
      # (schemas-register → producers). Failures during start_period are free.
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [txn-network]

  # One-shot: strip generator annotations (arg.properties / avro-datagen keys),
  # set subject compatibility BACKWARD, register the producers' *.avsc under
  # TopicNameStrategy subjects (<topic>-value) — ADR-011.
  schemas-register:
    build: 
      context: ./schema-registry
      dockerfile: Dockerfile
    pull_policy: build
    container_name: schemas-register
    depends_on:
      schema-registry: { condition: service_healthy }
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    restart: "no"
    volumes:
      - ../schemas/:/schemas:ro
    networks: [txn-network]

  # ────────────────────────────── Postgres ───────────────────────────────
  # Custom build = postgres:18 base (pinned) + pg_cron + pg_stat_statements.
  # initdb/ holds superuser bootstrap ONLY (CREATE EXTENSION ...); it runs solely
  # on an EMPTY volume — all schema lives in the migrations (drift trap otherwise).
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    pull_policy: build
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command: >
      postgres
      -c shared_preload_libraries='pg_stat_statements,pg_cron'
      -c pg_stat_statements.track=all
      -c cron.database_name=txn_agg
      -c cron.use_background_workers=on
      -c max_worker_processes=16
    volumes:
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U postgres -d postgres
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [txn-network]

  # drizzle-kit migrations (database/migrations), applied once each in journal
  # order: 0000 tables + grants, 0001 the category/rule seed, 0002 the pg_cron
  # partman-maintenance schedule (premake monthly partitions / drop >18 months).
  migrate:
    build:
      context: ../database
    pull_policy: build
    container_name: migrate
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: txn_agg
      DATABASE_USER: admin
      DATABASE_PASSWORD_SECRET_NAME: admin_password
      SECRET_DIR: /secrets
    volumes:
      - ../secrets:/secrets:ro
    restart: "no"
    networks: [txn-network]

  # ─────────────────────────── Applications ──────────────────────────────
  # One-shot: generates GENERATOR_COUNT card transactions (Avro, schema from the
  # registry) onto KAFKA_TOPIC via the in-network CLIENT listener, then exits.
  # Re-run alone with: make generate-card
  producer-card:
    build: 
      context: ../apps/producers
      dockerfile: Dockerfile
    pull_policy: build
    container_name: producer-card
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      # The producer pins its serializer to the subject's latest registry
      # version at startup — the subject must exist before it boots.
      schemas-register: { condition: service_completed_successfully }
    restart: "no"
    volumes:
      - ../schemas:/schemas:ro
    environment:
      KAFKA_BROKERS: kafka1:9094 # CLIENT listener (in-network SASL)
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_USERNAME: producer
      KAFKA_PASSWORD: producer-password # dev only; secret store in real use
      KAFKA_TOPIC: transactions.card
      KAFKA_KEY_FIELDS: customerId,userId,user_id,correlationId,id,key
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      GENERATOR_SCHEMA_PATH: /schemas/card.avsc
      GENERATOR_COUNT: "60000"
      # Empty = a random seed per run (make generate). make up passes a pinned one
      # (SEED in the Makefile), so it sends the same records every time.
      GENERATOR_SEED: ${GENERATOR_SEED:-}
      # Day the 18 months of history end on (00:00 UTC); empty = today.
      # make up pins it (ANCHOR_DATE in the Makefile).
      GENERATOR_ANCHOR_DATE: ${GENERATOR_ANCHOR_DATE:-}
      LOG_LEVEL: INFO
    networks: [txn-network]
  
  producer-eft:
    build: 
      context: ../apps/producers
      dockerfile: Dockerfile
    pull_policy: build
    container_name: producer-eft
    depends_on:
      kafka-init: { condition: service_completed_successfully }

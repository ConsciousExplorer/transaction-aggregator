    container_name: consumer-debit-order
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      schemas-register: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
    volumes:
      - ../secrets:/secrets:ro
    environment:
      # NODE and APP configuration
      NODE_ENV: production
      APP_NAME: "transaction-aggregator"
      HOST: 0.0.0.0
      PORT: 8080
      # Secrets and certs
      SECRET_DIR: "/secrets"
      TRANSACTION_TYPE: debit_order
      KAFKA_TOPIC: transactions.debit-order
      # Logging configuration
      LOG_LEVEL: info
      LOG_FORMAT: json
      LOG_PRETTY: false
      # Postgres configuration
      DATABASE_HOST: postgres
      DATABASE_NAME: txn_agg
      DATABASE_PORT: 5432
      DATABASE_USER: 'kafka_consumer'
      DATABASE_POOL_MIN: 2
      DATABASE_POOL_MAX: 3
      DATABASE_IDLE_TIMEOUT: 30000
      DATABASE_CONNECTION_TIMEOUT: 5000
      # Schema Registry configuration
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # KAFKA configuration
      KAFKA_BROKERS: 'kafka1:9094'
      KAFKA_USERNAME: consumer
      KAFKA_SASL_MECHANISM: SCRAM-SHA-512
      # Kafka group membership — library defaults (60s session) stall restarts
      KAFKA_SESSION_TIMEOUT_MS: 15000
      KAFKA_HEARTBEAT_INTERVAL_MS: 5000
      KAFKA_REBALANCE_TIMEOUT_MS: 30000
      KAFKA_REQUEST_TIMEOUT_MS: 40000
      # Fetch and batching
      KAFKA_MAX_WAIT_TIME_MS: 1000
      KAFKA_BATCH_SIZE: 100
      KAFKA_BATCH_LINGER_MS: 2000
      KAFKA_READ_MODE: committed
      # Secrets
      DATABASE_PASSWORD_SECRET_NAME: 'consumer_database_password'
      KAFKA_PASSWORD_SECRET_NAME: 'consumer_kafka_password'
      # Metrics and tracing — lag interval matches Prometheus scrape_interval
      KAFKA_LAG_MONITORING_INTERVAL_MS: 10000
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_SAMPLER: always_on
      OTEL_SERVICE_NAME: consumer-debit-order
    networks: [txn-network]

  consumer-loan:
    build:
      context: ../apps/consumer
    pull_policy: build
    container_name: consumer-loan
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      schemas-register: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
    volumes:
      - ../secrets:/secrets:ro
    environment:
      # NODE and APP configuration
      NODE_ENV: production
      APP_NAME: "transaction-aggregator"
      HOST: 0.0.0.0
      PORT: 8080
      # Secrets and certs
      SECRET_DIR: "/secrets"
      TRANSACTION_TYPE: loan
      KAFKA_TOPIC: transactions.loan
      # Logging configuration
      LOG_LEVEL: info
      LOG_FORMAT: json
      LOG_PRETTY: false
      # Postgres configuration
      DATABASE_HOST: postgres
      DATABASE_NAME: txn_agg
      DATABASE_PORT: 5432
      DATABASE_USER: 'kafka_consumer'
      DATABASE_POOL_MIN: 2
      DATABASE_POOL_MAX: 3
      DATABASE_IDLE_TIMEOUT: 30000
      DATABASE_CONNECTION_TIMEOUT: 5000
      # Schema Registry configuration
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # KAFKA configuration
      KAFKA_BROKERS: 'kafka1:9094'
      KAFKA_USERNAME: consumer
      KAFKA_SASL_MECHANISM: SCRAM-SHA-512
      # Kafka group membership — library defaults (60s session) stall restarts
      KAFKA_SESSION_TIMEOUT_MS: 15000
      KAFKA_HEARTBEAT_INTERVAL_MS: 5000
      KAFKA_REBALANCE_TIMEOUT_MS: 30000
      KAFKA_REQUEST_TIMEOUT_MS: 40000
      # Fetch and batching
      KAFKA_MAX_WAIT_TIME_MS: 1000
      KAFKA_BATCH_SIZE: 100
      KAFKA_BATCH_LINGER_MS: 2000
      KAFKA_READ_MODE: committed
      # Secrets
      DATABASE_PASSWORD_SECRET_NAME: 'consumer_database_password'
      KAFKA_PASSWORD_SECRET_NAME: 'consumer_kafka_password'
      # Metrics and tracing — lag interval matches Prometheus scrape_interval
      KAFKA_LAG_MONITORING_INTERVAL_MS: 10000
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_SAMPLER: always_on
      OTEL_SERVICE_NAME: consumer-loan
    networks: [txn-network]

  api:
    build: { context: ../apps/api }
    pull_policy: build
    container_name: api
    depends_on:
      migrate: { condition: service_completed_successfully }
      # Tokens are verified against Keycloak's JWKS; no answers before that works
      keycloak: { condition: service_healthy }
    ports:
      - "8083:8083"
    volumes:
      - ../secrets:/secrets:ro
    environment:
      NODE_ENV: 'production'
      HTTP_PORT: 8083
      ENABLE_SWAGGER: true
      LOG_LEVEL: 'debug'
      LOG_PRETTY: 'true'

      SECRET_DIR: "/secrets"

      # Postgres configuration
      DATABASE_HOST: postgres
      DATABASE_NAME: txn_agg
      DATABASE_PORT: 5432
      DATABASE_POOL_MIN: 2
      DATABASE_POOL_MAX: 10
      DATABASE_USER: "api_write"

      # Secrets
      DATABASE_PASSWORD_SECRET_NAME: "api_write_password"

      # Auth
      AUTH_JWKS_URI: "http://keycloak:8080/realms/txn-api/protocol/openid-connect/certs"
      AUTH_ISSUER: "http://localhost:8086/realms/txn-api"
      AUTH_AUDIENCE: 'txn-api'

      # Widest fromDateTime → toDateTime span per endpoint, in days
      WINDOW_MAX_DAYS_TRANSACTIONS: 92
      WINDOW_MAX_DAYS_SUMMARY: 366

      # Tracing: the Dockerfile loads the OTel auto-instrumentation, configured
      # entirely from these. Off unless an obs run opts in (OTEL_SDK_DISABLED=false).
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_SAMPLER: always_on
      OTEL_SERVICE_NAME: api
      # The collector carries traces only: metrics are Prometheus pull from
      # /metrics, logs go to stdout. Both exporters default to otlp otherwise.
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      # Incoming requests and their queries; everything else is noise
      OTEL_NODE_ENABLED_INSTRUMENTATIONS: http,pg

    # Readiness, not liveness: /ready runs SELECT 1, so "healthy" means the API
    # can answer queries. Docker never restarts an unhealthy container, so a
    # database outage cannot restart-loop a working process.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8083/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      start_period: 30s
      interval: 10s
      timeout: 5s

    networks: [txn-network]

  # ─────────────────────── Optional: cache profile ───────────────────────
  redis:
    profiles: ["cache"]
    image: redis:7.4-alpine
    container_name: redis
    networks: [txn-network]

  # ──────────────────────── Optional: obs profile ────────────────────────
  otel-collector:
    profiles: ["obs"]
    # 0.116.0's arm64 image ships a dynamically linked binary with no loader:
    # "exec /otelcol-contrib: no such file or directory" on Apple silicon
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [txn-network]

  tempo:
    profiles: ["obs"]
    image: grafana/tempo:2.6.1
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [txn-network]

  # Postgres's own statistics (pg_stat_*, pg_stat_statements) as Prometheus
  # metrics. Logs in as postgres_exporter: pg_monitor, no table data.
  postgres-exporter:
    profiles: ["obs"]
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    command:
      - --collector.stat_statements
      - --collector.stat_statements.include_query
      - --collector.stat_statements.query_length=200
      - --collector.stat_statements.limit=50
      # Its own scrape queries would otherwise rank among the slowest statements
      - --collector.stat_statements.exclude_users=postgres_exporter
      - --collector.long_running_transactions
      - --collector.stat_checkpointer
    environment:
      DATA_SOURCE_URI: postgres:5432/txn_agg?sslmode=disable
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS_FILE: /secrets/postgres_exporter_password
    volumes:
      # Only its own password, not the whole secrets folder the apps mount
      - ../secrets/postgres_exporter_password:/secrets/postgres_exporter_password:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [txn-network]

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    networks: [txn-network]

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Only its own password, not the whole secrets folder the apps mount
      - ../secrets/grafana_read_password:/secrets/grafana_read_password:ro
    networks: [txn-network]

  kafbat-ui:
    profiles: ["ui"]
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafbat-ui
    ports:
      - "8080:8080"
    environment:
      # 1. Kafka clusters for the UI to connect to (PLAINTEXT internal listener)
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

      # 2. Auth against Keycloak (OIDC/OAuth2)
      AUTH_TYPE: OAUTH2

      # 3. RBAC: Keycloak groups -> Kafbat roles mapping (see rbac.yml + oauth2.yml).
      SPRING_CONFIG_ADDITIONAL_LOCATION: /etc/kafkaui/rbac.yml,/etc/kafkaui/oauth2.yml

      SERVER_REACTIVE_SESSION_TIMEOUT: 12h
      SERVER_REACTIVE_SESSION_COOKIE_MAX_AGE: 12h
    volumes:
      - ./kafbat/rbac.yml:/etc/kafkaui/rbac.yml:ro
      - ./kafbat/oauth2.yml:/etc/kafkaui/oauth2.yml:ro
    depends_on:
      kafka1: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    networks: [txn-network]

  # Schema sample preview: avro-datagen's Streamlit UI over /schemas — generate
  # example records to copy/paste while writing normalizers/tests. Kafka producer
  # section is NOT enabled (no --kafka flag, no broker access needed); the mount
  # is read-only, so contract changes still go through git review, never the UI.
  # Starts with `make up` (ui profile)  →  http://localhost:8501
  avro-datagen-ui:
    profiles: ["ui"]
    build: { context: ./avro-datagen-ui }
    pull_policy: build
    container_name: avro-datagen-ui
    environment:
      PORT: "8501" # Streamlit's default; compose owns the port
    ports:
      - "8501:8501"
    volumes:
      - ../schemas/:/schemas:ro
    networks: [txn-network]

  # Core, not ui: the API verifies every bearer token against this realm's JWKS.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak_server
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # --import-realm loads every realm-export JSON under /opt/keycloak/data/import/
    command: start-dev --import-realm
    volumes:
      - ./keycloak/txn-api-realm.json:/opt/keycloak/data/import/txn-api-realm.json:ro
    environment:
      # Database Configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      
      # Initial Admin User Credentials
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      
      # Dev Features
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      KC_HOSTNAME: http://localhost:8086
    ports:
      - "8086:8080"
    # KC_HEALTH_ENABLED exposes /health/ready on the management port (9000 by
    # default, separate listener from the main 8080 HTTP port) — kafbat-ui's
    # depends_on: {condition: service_healthy} needs this to exist at all.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q 'UP' <&3"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [txn-network]

networks:
  txn-network:
    driver: bridge

volumes:
  kafka1-data:
  postgres-data:
  tempo-data:

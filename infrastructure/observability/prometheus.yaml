global:
  scrape_interval: 10s

scrape_configs:
  - job_name: consumer-card
    static_configs: [{ targets: ["consumer-card:8080"] }]
  - job_name: consumer-eft
    static_configs: [{ targets: ["consumer-eft:8080"] }]
  - job_name: consumer-loan
    static_configs: [{ targets: ["consumer-loan:8080"] }]
  - job_name: consumer-debit-order
    static_configs: [{ targets: ["consumer-debit-order:8080"] }]
  - job_name: consumer-internal-transfer
    static_configs: [{ targets: ["consumer-internal-transfer:8080"] }]
  - job_name: api
    static_configs: [{ targets: ["api:8083"] }]

# Broker defaults — mounted at /mnt/shared/config/server.properties, the
# apache/kafka image's file input. KAFKA_* env vars in docker-compose override
# anything set here. NOTE: .properties files have no inline comments — a
# trailing "# ..." becomes part of the value and breaks parsing.

# Hard rule: applications should not create topics — just like applications
# should not create a database or tables in a database. Topics are created by
# kafka-init (or an admin); ACLs deny Create to app principals.
auto.create.topics.enable=false
# Users should be able to delete old topics
delete.topic.enable=true

# Defaults
# Load should be evenly distributed across partitions. Partition count should be
# divisible by the number of consumers in a consumer group; 6 is a good default
# for most use cases.
num.partitions=6
log.retention.hours=168
message.max.bytes=1048576
log.retention.bytes=-1
log.segment.bytes=1073741824

# Dev config
default.replication.factor=1
min.insync.replicas=1

# Prod config
# default.replication.factor=3
# min.insync.replicas=2
